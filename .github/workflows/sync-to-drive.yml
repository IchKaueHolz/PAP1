name: Sync Repository to Google Drive

on:
  push:
    branches:
      - main

jobs:
  upload-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to Google Drive
        uses: Jbwasse2/google-drive-upload-action@v2.2.3
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          # This alternative action forces file upload streams directly 
          # into the parent directory's allocated account quota pool.
          uploadPath: '.' 
