name: Sync Repository to Google Drive

on:
  push:
    branches:
      - main

jobs:
  upload-to-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Hier installieren wir rclone nativ ohne fehlerhafte Drittanbieter-Aktion
      - name: Install Rclone
        run: |
          sudo -v ; curl https://rclone.org | sudo bash

      - name: Configure Rclone & Sync Files
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # Rclone Konfiguration für dein persönliches Google Drive erstellen
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          token = $RCLONE_TOKEN
          root_folder_id = $FOLDER_ID
          EOF

          # Dateien hochladen (exclude spart Git-Metadaten und den Workflow selbst aus)
          rclone copy . gdrive: --exclude ".git/**" --exclude ".github/**"
